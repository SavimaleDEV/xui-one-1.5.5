# These count only auth.php requests, not the stream after its redirect.
limit_conn xui_channel_opens 24;
limit_conn xui_total_opens 160;
limit_conn_status 503;
# Preserve the existing per-IP policy and add a global startup ceiling.
limit_req zone=one burst=8;
limit_req zone=xui_open_rate burst=400 nodelay;
limit_req_status 503;
add_header Retry-After $xui_guard_retry_after always;
