# Source failover is managed by XUI; no source URLs or retry settings changed.
location = /stream/auth.php {
    include source_guard_rules.conf;
    access_log /home/xui/bin/nginx/logs/source_guard.log xui_source_guard if=$xui_guard_rejected;
    try_files $uri =404;
    fastcgi_index index.php;
    fastcgi_pass php;
    include fastcgi_params;
    fastcgi_buffering on;
    fastcgi_buffers 128 32k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_max_temp_file_size 0;
    fastcgi_keep_conn on;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
}
