# Bound slow channel-open work without counting continuous playback.
map $arg_stream $xui_guard_channel_id {
    default "";
    ~^(?<xui_guard_numeric_id>[0-9]+)(?:\.[a-zA-Z0-9]+)?$ $xui_guard_numeric_id;
}
map "$uri:$arg_type" $xui_guard_channel_key {
    default "";
    "/stream/auth.php:live" $xui_guard_channel_id;
}
map $status $xui_guard_retry_after {
    default "";
    503 "2";
}
map "$limit_conn_status:$limit_req_status" $xui_guard_rejected {
    default 0;
    ~REJECTED 1;
}
limit_conn_zone $xui_guard_channel_key zone=xui_channel_opens:4m;
limit_conn_zone $server_addr zone=xui_total_opens:1m;
limit_req_zone $server_addr zone=xui_open_rate:1m rate=200r/s;
log_format xui_source_guard '$time_iso8601 channel=$xui_guard_channel_key status=$status conn=$limit_conn_status rate=$limit_req_status seconds=$request_time';
