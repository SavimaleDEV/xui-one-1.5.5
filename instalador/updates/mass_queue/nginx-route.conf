# XUI controlled mass edit: named redirect preserves POST method and body.
location @xui_mass_queue_post {
    proxy_pass http://127.0.0.1:19462;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-XUI-Client-IP $remote_addr;
    proxy_set_header X-XUI-Client-Port $remote_port;
    proxy_set_header X-XUI-Server-IP $server_addr;
    proxy_set_header X-XUI-Server-Port $server_port;
    proxy_set_header X-XUI-Scheme $scheme;
    proxy_set_header X-XUI-Original-URI $request_uri;
    proxy_connect_timeout 3s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
}
